<!DOCTYPE html>
<html>
<head>
    <title>NexusHub Super App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: #090d16; color: white; font-family: sans-serif; margin: 0; padding: 0; }
        header { background: #0f172a; padding: 15px 20px 15px 60px; font-size: 20px; font-weight: bold; color: #38bdf8; }
        #menu-btn { position: fixed; top: 12px; left: 15px; background: #1e293b; color: white; border: none; padding: 8px 12px; border-radius: 8px; font-size: 18px; cursor: pointer; }
        .container { max-width: 600px; margin: 30px auto; padding: 20px; background: #111827; border-radius: 12px; border: 1px solid #1f2937; }
        .btn { width: 100%; padding: 12px; background: #38bdf8; color: #0f172a; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <button id="menu-btn" onclick="alert("NexusHub Menu: Edit Profile & Settings")">&#9776;</button>
    <header>NexusHub Super App</header>
    <div class="container">
        <h2>Welcome to NexusHub</h2>
        <p style="color: #94a3b8; margin: 10px 0 20px 0;">Your professional social network, chat, and wallet.</p>
        <button class="btn" onclick="alert("NexusFeed post created successfully!")">Create Post</button>
    </div>
</body>
</html>
