<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="appTitle">Super App</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f4f9; }
    header { background: #0084ff; color: white; padding: 15px; text-align: center; display: flex; align-items: center; justify-content: center; gap: 15px; }
    header img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: white; }
    nav { display: flex; justify-content: space-around; background: #222; flex-wrap: wrap; }
    nav button { color: white; background: none; border: none; padding: 12px; cursor: pointer; flex: 1; font-size: 13px; min-width: 75px; }
    nav button:hover { background: #444; }
    .tab-content { display: none; padding: 20px; max-width: 600px; margin: auto; }
    .active { display: block; }
    .card { background: white; padding: 15px; margin-bottom: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    input, textarea { width: 100%; padding: 8px; margin: 5px 0 12px 0; box-sizing: border-box; }
    button.action-btn { background: #0084ff; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; }
    img, video { max-width: 100%; border-radius: 5px; }
    .comment-box { background: #f9f9f9; padding: 8px; margin-top: 8px; border-radius: 5px; font-size: 14px; }
    .tx-item { padding: 6px; border-bottom: 1px solid #eee; font-size: 13px; }
  </style>
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f172a">

    <title>NexusHub - The Ultimate Social Super App</title>
    <meta name="description" content="Connect, chat, share feeds, and manage your digital wallet globally on NexusHub, the all-in-one social super app." />
    <meta property="oh:title" content="NexusHub Super App" />
    <meta property="og:description" content="Join the global community on NexusHub." />
    <meta property="og:image" content="https://tendigit-app.onrender.com/icon.svg" />

</head>
<body>

  <header>
    <img id="appHeaderIcon" src="/uploads/default-icon.png" alt="App Icon">
    <div>
      <h1 id="appHeaderName" style="margin: 0; font-size: 22px;">Super App</h1>
      <p style="margin: 0; font-size: 12px;">WhatsApp • Facebook • Twitter • TikTok</p>
    </div>
  </header>

  <nav>
    <button onclick="showTab('auth')" id="navAuth">Account</button>
    <button onclick="showTab('feed')">Feed</button>
    <button onclick="showTab('reels'); loadReels();">Reels 🎬</button>
    <button onclick="showTab('search')">Search 🔍</button>
    <button onclick="showTab('chat')">WhatsApp</button>
    <button onclick="showTab('wallet'); loadWallet();">Wallet 💰</button>
  </nav>

  <!-- Auth Tab -->
  <div id="auth" class="tab-content active">
    <div class="card">
      <h2>Register / Login</h2>
      <input type="text" id="username" placeholder="Username">
      <input type="password" id="password" placeholder="Password">
      <button class="action-btn" onclick="register()">Register</button>
      <button class="action-btn" onclick="login()" style="background:#28a745;">Login</button>
      <p id="userInfo" style="margin-top:15px; font-weight:bold; color:green;"></p>
    </div>
  </div>

  <!-- Feed Tab -->
  <div id="feed" class="tab-content">
    <div class="card">
      <h3>Create Post / Video</h3>
      <textarea id="postContent" placeholder="What's happening? (#trending, #tech)"></textarea>
      <input type="file" id="postMedia">
      <button class="action-btn" onclick="createPost()">Publish</button>
    </div>
    <div id="feedList"></div>
  </div>

  <!-- Reels Tab -->
  <div id="reels" class="tab-content">
    <h2>Trending Video Reels</h2>
    <div id="reelsList"></div>
  </div>

  <!-- Search Tab -->
  <div id="search" class="tab-content">
    <div class="card">
      <h2>Search Users & Creators</h2>
      <input type="text" id="searchQuery" placeholder="Search by username or 10-digit ID..." onkeyup="searchUsers()">
      <div id="searchResults" style="margin-top: 15px;"></div>
    </div>
  </div>

  <!-- WhatsApp Chat Tab -->
  <div id="chat" class="tab-content">
    <div class="card">
      <h2>WhatsApp 10-Digit Chat</h2>
      <input type="text" id="targetTenDigit" placeholder="Recipient 10-Digit ID">
      <button class="action-btn" onclick="loadChatHistory()" style="background:#6c757d; margin-bottom:10px;">Load Chat History</button>
      <div id="chatMessages" style="height: 180px; overflow-y: scroll; border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; background: #fafafa;"></div>
      <input type="text" id="chatInput" placeholder="Type a message...">
      <button class="action-btn" onclick="sendMessage()">Send Message</button>
    </div>
  </div>

  <!-- Wallet Tab -->
  <div id="wallet" class="tab-content">
    <div class="card">
      <h2>Creator Wallet & Earnings</h2>
      <h3>Balance: <span id="walletBalance">$0.00</span></h3>
      <h4 style="margin-top: 20px;">Recent Transactions</h4>
      <div id="txList" style="max-height: 150px; overflow-y: auto; text-align: left;"></div>
      <button class="action-btn" onclick="loadWallet()" style="margin-top: 15px;">Refresh Balance</button>
      
      <div style="margin-top: 20px; padding-top: 15px; border-top: 1px solid #eee;">
        <h3>Withdraw Earnings to M-Pesa</h3>
        <input type="text" id="payoutName" placeholder="Full Name as on ID">
        <input type="text" id="payoutNationalId" placeholder="National ID Number">
        <input type="text" id="payoutMpesaPhone" placeholder="Safaricom M-Pesa Phone Number">
        <button class="action-btn" onclick="savePayoutProfile()" style="background: #28a745;">Save M-Pesa Details</button>
        <br><br>
        <input type="number" id="withdrawAmount" placeholder="Amount ($) to withdraw">
        <button class="action-btn" onclick="requestWithdrawal()" style="background: #ff9900;">Withdraw to M-Pesa 📲</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let currentUser = null;

    async function loadAppInfo() {
      const res = await fetch('/api/app/info');
      const data = await res.json();
      if (data.app_name) {
        document.getElementById('appHeaderName').innerText = data.app_name;
        document.getElementById('appTitle').innerText = data.app_name;
      }
      if (data.app_icon_url) {
        document.getElementById('appHeaderIcon').src = data.app_icon_url;
      }
    }
    loadAppInfo();

    function showTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
    }

    async function register() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (data.success) {
        currentUser = data.user;
        document.getElementById('userInfo').innerText = `Logged in as @${currentUser.username} | 10-Digit ID: ${currentUser.ten_digit_id}`;
        socket.emit('join_chat', currentUser.ten_digit_id);
        loadFeed();
        loadWallet();
        showTab('feed');
      } else {
        alert(data.error);
      }
    }

    async function login() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (data.success) {
        currentUser = data.user;
        document.getElementById('userInfo').innerText = `Logged in as @${currentUser.username} | 10-Digit ID: ${currentUser.ten_digit_id}`;
        socket.emit('join_chat', currentUser.ten_digit_id);
        loadFeed();
        loadWallet();
        showTab('feed');
      } else {
        alert(data.error);
      }
    }

    async function createPost() {
      if (!currentUser) return alert('Please login first!');
      const content = document.getElementById('postContent').value;
      const media = document.getElementById('postMedia').files[0];
      const formData = new FormData();
      formData.append('user_id', currentUser.id);
      formData.append('content', content);
      if (media) formData.append('media', media);

      await fetch('/api/posts', { method: 'POST', body: formData });
      document.getElementById('postContent').value = '';
      document.getElementById('postMedia').value = '';
      loadFeed();
    }

    async function loadFeed() {
      if (!currentUser) return;
      const res = await fetch(`/api/feed/${currentUser.id}`);
      const posts = await res.json();
      document.getElementById('feedList').innerHTML = posts.map(p => `
        <div class="card">
          <strong>@${p.username}</strong> <small style="color:gray;">(ID: ${p.ten_digit_id})</small>
          <span style="float:right; font-size:12px; color:#0084ff;">📍 ${p.country}</span>
          <p>${p.content}</p>
          ${p.media_type === 'image' ? `<img src="${p.media_url}">` : ''}
          ${p.media_type === 'video' ? `<video controls src="${p.media_url}"></video>` : ''}
          
          <div style="margin-top: 10px;">
            <button class="action-btn" onclick="likePost(${p.id})">👍 Like (${p.likes})</button>
            <button class="action-btn" onclick="tipCreator(${p.user_id})" style="background:#ff9900;">Tip ($2.00) 💰</button>
          </div>

          <div style="margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px;">
            <h4>Comments</h4>
            <div id="comments-${p.id}">
              ${p.comments.map(c => `<div class="comment-box"><b>@${c.username}:</b> ${c.comment}</div>`).join('')}
            </div>
            <input type="text" id="comment-input-${p.id}" placeholder="Write a comment..." style="margin-top: 5px;">
            <button class="action-btn" onclick="addComment(${p.id})">Post Comment</button>
          </div>
        </div>
      `).join('');
    }

    async function loadReels() {
      const res = await fetch('/api/reels');
      const reels = await res.json();
      const container = document.getElementById('reelsList');
      if (reels.length === 0) {
        container.innerHTML = `<div class="card"><p>No video reels uploaded yet.</p></div>`;
        return;
      }
      container.innerHTML = reels.map(r => `
        <div class="card" style="text-align: center; background: #000; color: white;">
          <strong>@${r.username}</strong>
          <video controls src="${r.media_url}" style="max-height: 400px; width: 100%; object-fit: cover; margin-top: 10px;"></video>
          <p style="text-align: left; margin-top: 8px;">${r.content}</p>
          <button class="action-btn" onclick="tipCreator(${r.user_id})" style="background:#ff9900; width: 100%;">Tip Creator ($2.00) 💰</button>
        </div>
      `).join('');
    }

    async function searchUsers() {
      const query = document.getElementById('searchQuery').value;
      if (!query) return document.getElementById('searchResults').innerHTML = '';
      const res = await fetch(`/api/users/search?q=${query}`);
      const users = await res.json();
      document.getElementById('searchResults').innerHTML = users.map(u => `
        <div style="padding: 8px; border-bottom: 1px solid #eee;">
          <b>@${u.username}</b> | ID: ${u.ten_digit_id} (${u.city}, ${u.country})
          <button class="action-btn" style="float:right; padding:3px 8px; font-size:12px;" onclick="startChat('${u.ten_digit_id}')">Chat</button>
        </div>
      `).join('');
    }

    function startChat(tenDigitId) {
      document.getElementById('targetTenDigit').value = tenDigitId;
      showTab('chat');
      loadChatHistory();
    }

    async function loadChatHistory() {
      if (!currentUser) return alert('Please login first!');
      const targetTenDigit = document.getElementById('targetTenDigit').value;
      if (!targetTenDigit) return;

      const res = await fetch(`/api/messages/${currentUser.id}/${targetTenDigit}`);
      const msgs = await res.json();
      const chatBox = document.getElementById('chatMessages');
      chatBox.innerHTML = msgs.map(m => `<div><b>@${m.sender_name}:</b> ${m.message}</div>`).join('');
    }

    async function likePost(postId) {
      await fetch('/api/posts/like', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ postId })
      });
      loadFeed();
    }

    async function addComment(postId) {
      if (!currentUser) return alert('Please login first!');
      const commentInput = document.getElementById(`comment-input-${postId}`);
      const comment = commentInput.value;
      if (!comment) return;

      await fetch('/api/comments', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ post_id: postId, user_id: currentUser.id, comment })
      });
      loadFeed();
    }

    async function tipCreator(receiverId) {
      if (!currentUser) return alert('Please login first!');
      await fetch('/api/tip', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sender_id: currentUser.id, receiver_id: receiverId, amount: 2.00 })
      });
      alert('Tip sent successfully!');
      loadWallet();
    }

    async function savePayoutProfile() {
      if (!currentUser) return alert('Please login first!');
      const fullName = document.getElementById('payoutName').value;
      const nationalId = document.getElementById('payoutNationalId').value;
      const mpesaPhone = document.getElementById('payoutMpesaPhone').value;

      const res = await fetch('/api/payout/setup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: currentUser.id, full_name: fullName, national_id: nationalId, mpesa_phone: mpesaPhone })
      });
      const data = await res.json();
      if (data.success) alert('M-Pesa Payout profile saved!');
      else alert(data.error);
    }

    async function requestWithdrawal() {
      if (!currentUser) return alert('Please login first!');
      const amount = parseFloat(document.getElementById('withdrawAmount').value);
      if (!amount || amount <= 0) return alert('Enter valid withdrawal amount');

      const res = await fetch('/api/payout/withdraw', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: currentUser.id, amount })
      });
      const data = await res.json();
      if (data.success) {
        alert(data.message);
        loadWallet();
      } else {
        alert(data.error);
      }
    }

    async function loadWallet() {
      if (!currentUser) return;
      const res = await fetch(`/api/wallet/${currentUser.id}`);
      const data = await res.json();
      document.getElementById('walletBalance').innerText = `$${data.balance.toFixed(2)}`;
      
      const txList = document.getElementById('txList');
      txList.innerHTML = data.transactions.map(tx => `
        <div class="tx-item">
          <b>${tx.type}</b>: $${tx.amount.toFixed(2)} <small style="color:gray;">(${tx.description})</small>
        </div>
      `).join('');
    }

    function sendMessage() {
      if (!currentUser) return alert('Please login first!');
      const targetTenDigit = document.getElementById('targetTenDigit').value;
      const message = document.getElementById('chatInput').value;
      if (!targetTenDigit || !message) return alert('Enter recipient 10-digit ID and message');

      socket.emit('send_message', {
        senderId: currentUser.id,
        receiverTenDigit: targetTenDigit,
        message: message
      });

      const chatBox = document.getElementById('chatMessages');
      chatBox.innerHTML += `<div><b>You:</b> ${message}</div>`;
      document.getElementById('chatInput').value = '';
    }

    socket.on('receive_message', (data) => {
      const chatBox = document.getElementById('chatMessages');
      chatBox.innerHTML += `<div><b>Friend:</b> ${data.message}</div>`;
    });
  </script>
</body>
</html>
