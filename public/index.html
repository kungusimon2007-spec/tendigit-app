<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusHub - Social App</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #090d16; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }
        header { background: #0f172a; border-bottom: 1px solid #1e293b; padding: 12px 20px 12px 60px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 99; }
        .logo-icon { width: 34px; height: 34px; background: linear-gradient(135deg, #fe2c55, #25f4ee); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #0f172a; }
        #hamburger-btn { position: fixed; top: 12px; left: 15px; z-index: 1000; background: #1e293b; color: white; border: none; width: 38px; height: 38px; border-radius: 10px; cursor: pointer; font-size: 18px; }
        #nexus-drawer { position: fixed; top: 0; left: -300px; width: 280px; height: 100%; background: #0f172a; z-index: 1001; transition: left 0.3s; padding: 25px; border-right: 1px solid #1e293b; display: flex; flex-direction: column; }
        #nexus-drawer.open { left: 0; }
        .drawer-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; display: none; }
        .drawer-overlay.active { display: block; }
        .tabs-bar { display: flex; background: #0f172a; border-bottom: 1px solid #1e293b; }
        .tab-btn { flex: 1; padding: 14px; background: none; border: none; color: #94a3b8; font-weight: 600; cursor: pointer; text-align: center; }
        .tab-btn.active { color: #fe2c55; border-bottom: 2px solid #fe2c55; }
        .main-container { max-width: 600px; width: 100%; margin: 20px auto; padding: 0 15px; flex: 1; }
        .card, .create-post-box, .social-post { background: #111827; border: 1px solid #1f2937; border-radius: 14px; padding: 16px; margin-bottom: 16px; }
        .form-control { width: 100%; padding: 12px; background: #090d16; border: 1px solid #374151; border-radius: 10px; color: white; outline: none; margin-bottom: 10px; }
        .btn { width: 100%; padding: 12px; background: #fe2c55; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="drawer-overlay" class="drawer-overlay" onclick="toggleMenu()"></div>
    <button id="hamburger-btn" onclick="toggleMenu()">☰</button>

    <div id="nexus-drawer">
        <h3>Menu</h3>
        <ul style="list-style:none; margin-top:20px;">
            <li style="margin-bottom:12px;"><a onclick="openTab('profile')" style="color:#cbd5e1; cursor:pointer;">👤 My Profile</a></li>
            <li><a onclick="openTab('wallet')" style="color:#cbd5e1; cursor:pointer;">💰 Creator Wallet</a></li>
            <li style="margin-top:20px;"><a onclick="logout()" style="color:#ef4444; cursor:pointer;">🚪 Logout</a></li>
        </ul>
    </div>

    <header>
        <div style="display:flex; align-items:center; gap:10px;">
            <div class="logo-icon">N</div>
            <h1>NexusHub</h1>
        </div>
    </header>

    <div id="auth-screen" class="main-container">
        <div class="card">
            <h2>Login to NexusHub</h2>
            <input type="text" id="auth-username" class="form-control" placeholder="Username">
            <input type="password" id="auth-password" class="form-control" placeholder="Password">
            <button class="btn" onclick="handleAuth()">Login</button>
        </div>
    </div>

    <div id="app-dashboard" class="hidden">
        <div class="tabs-bar">
            <button class="tab-btn active" onclick="switchTab('feed', event)">📰 Feed</button>
            <button class="tab-btn" onclick="switchTab('chat', event)">💬 Chat</button>
        </div>

        <div id="tab-feed" class="main-container tab-content">
            <div class="create-post-box">
                <textarea id="post-text" class="form-control" placeholder="What's on your mind?"></textarea>
                <button class="btn" onclick="createPost()">Post</button>
            </div>
            <div id="feed-container"></div>
        </div>

        <div id="tab-chat" class="main-container tab-content hidden">
            <div class="card" style="height:400px; display:flex; flex-direction:column;">
                <div id="chat-messages" style="flex:1; overflow-y:auto; background:#090d16; padding:10px; border-radius:8px; margin-bottom:10px;"></div>
                <input type="text" id="chat-input" class="form-control" placeholder="Type message..." onkeypress="if(event.key==='Enter') sendChat()">
            </div>
        </div>

        <div id="tab-profile" class="main-container tab-content hidden">
            <div class="card">
                <h2>My Profile</h2>
                <p id="profile-user-display" style="margin-top:10px; color:#94a3b8;"></p>
            </div>
        </div>

        <div id="tab-wallet" class="main-container tab-content hidden">
            <div class="card">
                <h2>Creator Wallet</h2>
                <div style="font-size:28px; font-weight:bold; margin:15px 0;">$0.00</div>
                <p style="color:#94a3b8; font-size:13px;">Diamonds: 0 | Coins: 0</p>
            </div>
        </div>
    </div>

    <script>
        localStorage.removeItem('nexus_posts'); // Clear old dummy posts
        let currentUser = localStorage.getItem('nexus_user') || '';
        let posts = [];

        function checkAuth() {
            if (currentUser) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-dashboard').classList.remove('hidden');
                document.getElementById('profile-user-display').innerText = '@' + currentUser;
                renderFeed();
            } else {
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('app-dashboard').classList.add('hidden');
            }
        }
        function handleAuth() {
            let u = document.getElementById('auth-username').value.trim();
            if (!u) return alert('Enter username');
            currentUser = u;
            localStorage.setItem('nexus_user', u);
            checkAuth();
        }
        function logout() {
            localStorage.removeItem('nexus_user');
            currentUser = '';
            toggleMenu();
            checkAuth();
        }
        function toggleMenu() {
            document.getElementById('nexus-drawer').classList.toggle('open');
            document.getElementById('drawer-overlay').classList.toggle('active');
        }
        function switchTab(name, e) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + name).classList.remove('hidden');
            if(e) e.currentTarget.classList.add('active');
        }
        function openDrawerTab(name) {
            toggleMenu();
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + name).classList.remove('hidden');
        }
        function createPost() {
            let txt = document.getElementById('post-text').value.trim();
            if(!txt) return alert('Write something');
            posts.unshift({ author: currentUser, text: txt, likes: 0, liked: false });
            document.getElementById('post-text').value = '';
            renderFeed();
        }
        function toggleLike(idx) {
            let p = posts[idx];
            p.liked ? (p.likes--, p.liked=false) : (p.likes++, p.liked=true);
            renderFeed();
        }
        function renderFeed() {
            let c = document.getElementById('feed-container');
            c.innerHTML = posts.length === 0 ? '<div style="text-align:center; color:#64748b; padding:20px;">No posts yet. Be the first!</div>' : '';
            posts.forEach((p, idx) => {
                c.innerHTML += `<div class="social-post">
                    <b>@${p.author}</b><p style="margin:8px 0;">${p.text}</p>
                    <button onclick="toggleLike(${idx})" style="background:none; border:none; color:${p.liked?'#fe2c55':'#94a3b8'}; cursor:pointer;">👍 Like (${p.likes})</button>
                </div>`;
            });
        }
        function sendChat() {
            let inp = document.getElementById('chat-input');
            if(!inp.value.trim()) return;
            let box = document.getElementById('chat-messages');
            box.innerHTML += `<div><b>@${currentUser}:</b> ${inp.value}</div>`;
            inp.value = '';
            box.scrollTop = box.scrollHeight;
        }
        window.onload = checkAuth;
    </script>
</body>
</html>
