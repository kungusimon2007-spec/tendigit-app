<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusHub - Ultimate Social Platform</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
</head>
<body>
    <!-- Authentication View -->
    <div id="auth-container" class="auth-wrapper">
        <div class="auth-card">
            <h2 class="auth-title">Welcome to NexusHub</h2>
            <p>Connect with friends and the world securely.</p>
            
            <div class="auth-tabs">
                <button type="button" class="tab-btn active" onclick="setAuthMode('login')">Log In</button>
                <button type="button" class="tab-btn" onclick="setAuthMode('signup')">Create Account</button>
            </div>

            <form id="auth-form" onsubmit="handleNexusAuth(event)">
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="name@example.com">
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="auth-submit-btn">Log In</button>
            </form>
        </div>
    </div>

    <!-- Main App View (Hidden until authenticated) -->
    <div id="app-main" class="app-container" style="display: none;">
        <header class="app-header">
            <div class="brand">
                <h1>NexusHub</h1>
                <span class="subtitle">Social Feed • NexusChat • Status</span>
            </div>
            
            <!-- Three-Dots Menu housing the hidden secure Wallet feature -->
            <div class="menu-dropdown-container">
                <button type="button" class="three-dots-btn" onclick="toggleMenu()">⋮</button>
                <div id="dropdown-menu" class="dropdown-content" style="display: none;">
                    <a href="#" onclick="openCameraStudio()">Camera Studio</a>
                    <a href="#" onclick="openEncryptedChat()">Encrypted Chat</a>
                    <!-- Hidden secure wallet feature located inside the three-dots menu -->
                    <a href="#" onclick="openSecureWallet()" class="wallet-menu-item">Secure Wallet</a>
                    <a href="#" onclick="handleLogout()">Log Out</a>
                </div>
            </div>
        </header>

        <main class="feed-container">
            <div class="feed-welcome-card">
                <h3>Welcome back to NexusHub!</h3>
                <p>Your encrypted channels and camera studio are ready.</p>
            </div>
        </main>
    </div>

    <!-- Firebase SDKs and App Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // Initialize Firebase (replace with your config if custom credentials are needed)
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForNexusHubDeployment",
            authDomain: "tendigit-app.firebaseapp.com",
            projectId: "tendigit-app",
            storageBucket: "tendigit-app.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        let currentMode = 'login';

        window.setAuthMode = function(mode) {
            currentMode = mode;
            const titleEl = document.querySelector('.auth-title');
            const submitBtn = document.querySelector('.auth-submit-btn');
            const tabs = document.querySelectorAll('.tab-btn');
            
            tabs.forEach(t => t.classList.remove('active'));
            if (event && event.target) event.target.classList.add('active');

            if (titleEl) titleEl.textContent = mode === 'login' ? 'Welcome to NexusHub' : 'Create NexusHub Account';
            if (submitBtn) submitBtn.textContent = mode === 'login' ? 'Log In' : 'Sign Up';
        };

        window.handleNexusAuth = async function(event) {
            if (event) event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                if (currentMode === 'login') {
                    await signInWithEmailAndPassword(auth, email, password);
                } else {
                    await createUserWithEmailAndPassword(auth, email, password);
                }
                document.getElementById('auth-container').style.display = 'none';
                document.getElementById('app-main').style.display = 'block';
            } catch (error) {
                console.error("Authentication Error:", error.message);
                alert("Auth Error: " + error.message);
            }
        };

        window.toggleMenu = function() {
            const menu = document.getElementById('dropdown-menu');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        };

        window.openCameraStudio = function() {
            alert("Opening Camera Studio...");
        };

        window.openEncryptedChat = function() {
            alert("Opening End-to-End Encrypted Chat...");
        };

        window.openSecureWallet = function() {
            alert("Opening Secure Wallet...");
        };

        window.handleLogout = async function() {
            await signOut(auth);
            document.getElementById('app-main').style.display = 'none';
            document.getElementById('auth-container').style.display = 'flex';
        };
    </script>
</body>
</html>
